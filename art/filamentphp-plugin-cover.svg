<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background & Ambient Glow Gradients -->
    <linearGradient id="cbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="55%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#03060c"/>
    </linearGradient>
    <radialGradient id="cglowEmerald" cx="10%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cglowOrange" cx="25%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cglowIndigo" cx="85%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- Official Logo Gradients & Glow -->
    <linearGradient id="cOrangeLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fba15a"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="cSlateLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="cGlowLogo" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f97316" flood-opacity="0.35"/>
    </filter>

    <!-- Window & Terminal Drop Shadow -->
    <filter id="cTerminalShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#cbg)"/>
  <rect width="1200" height="630" fill="url(#cglowEmerald)"/>
  <rect width="1200" height="630" fill="url(#cglowOrange)"/>
  <rect width="1200" height="630" fill="url(#cglowIndigo)"/>

  <!-- Cyber Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="220" y1="0" x2="220" y2="630"/>
    <line x1="340" y1="0" x2="340" y2="630"/>
    <line x1="460" y1="0" x2="460" y2="630"/>
    <line x1="580" y1="0" x2="580" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="820" y1="0" x2="820" y2="630"/>
    <line x1="940" y1="0" x2="940" y2="630"/>
    <line x1="1060" y1="0" x2="1060" y2="630"/>
  </g>

  <!-- Left Column: Branding, Badges & Highlights -->
  <g transform="translate(60, 48)">

    <!-- Category Pill -->
    <rect width="250" height="30" rx="15" fill="#1e293b" fill-opacity="0.85" stroke="#f59e0b" stroke-opacity="0.35"/>
    <circle cx="16" cy="15" r="3.5" fill="#f59e0b"/>
    <text x="28" y="19.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#fbbf24" letter-spacing="1.2">FILAMENT PLUGIN · CORE EDITION</text>

    <!-- Brand Lockup: Official Vector Shield Logo + Strict Kerning Title -->
    <g transform="translate(0, 52)">
      <!-- Official Shield Logo (76x76) -->
      <g transform="scale(0.148)" filter="url(#cGlowLogo)">
        <path d="M256 32 L64 104 L64 304 C64 424 144 488 256 512 C368 488 448 424 448 304 L448 104 Z" fill="url(#cSlateLogo)"/>
        <path d="M256 32 L448 104 L448 304 C448 424 368 488 256 512 Z" fill="#020617" opacity="0.4"/>
        <path d="M256 96 L128 144 L128 304 C128 392 184 440 256 464 C328 440 384 392 384 304 L384 144 Z" fill="url(#cOrangeLogo)"/>
        <path d="M256 96 L384 144 L384 304 C384 392 328 440 256 464 Z" fill="#ea580c"/>
        <path d="M 160 256 L 208 336 L 256 256 L 304 336 L 384 192" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="256" cy="168" r="24" fill="#ffffff"/>
      </g>

      <!-- Main Title: strictly single continuous word, crisp letter spacing -->
      <text x="94" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="900" fill="#ffffff" letter-spacing="-1.5">Fila<tspan fill="#f97316">Warden</tspan></text>
    </g>

    <!-- Taglines -->
    <text x="0" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f1f5f9" letter-spacing="-0.2">Production Sentinel, Security Intelligence &amp; Health Auditor</text>
    <text x="0" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#38bdf8">Engineered Natively for Laravel Filament Panels</text>

    <!-- Compatibility Pills (Generous border padding, zero text spillover) -->
    <g transform="translate(0, 222)">
      <!-- Filament v4 & v5 -->
      <rect width="144" height="34" rx="8" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.45"/>
      <text x="72" y="21.5" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">Filament v4 &amp; v5</text>

      <!-- Laravel 11–13 -->
      <rect x="154" width="124" height="34" rx="8" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-opacity="0.45"/>
      <text x="216" y="21.5" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#f87171" text-anchor="middle">Laravel 11–13</text>

      <!-- Zero Daemons (Wide 136px box, generous space, NO spillover) -->
      <rect x="288" width="136" height="34" rx="8" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.45"/>
      <text x="356" y="21.5" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">Zero Daemons</text>

      <!-- PHP 8.2–8.5 -->
      <rect x="434" width="118" height="34" rx="8" fill="#6366f1" fill-opacity="0.12" stroke="#6366f1" stroke-opacity="0.45"/>
      <text x="493" y="21.5" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#a5b4fc" text-anchor="middle">PHP 8.2–8.5</text>
    </g>

    <!-- Feature Bullets with Glowing Pulse Dots -->
    <g transform="translate(0, 292)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1">
      <!-- Bullet 1 -->
      <circle cx="5" cy="5" r="4" fill="#10b981"/>
      <text x="22" y="9">12-Point Deployment Readiness &amp; Security Auditor</text>

      <!-- Bullet 2 -->
      <circle cx="5" cy="35" r="4" fill="#10b981"/>
      <text x="22" y="39">Real-Time Worker Queues &amp; Cron Scheduler Overseer</text>

      <!-- Bullet 3 -->
      <circle cx="5" cy="65" r="4" fill="#10b981"/>
      <text x="22" y="69">Database InnoDB &amp; Storage Footprint Analyzer</text>

      <!-- Bullet 4 -->
      <circle cx="5" cy="95" r="4" fill="#10b981"/>
      <text x="22" y="99">Pro: APM Slow Queries, Secret Leaks &amp; Incident Triage</text>
    </g>

  </g>

  <!-- Right Column: Interactive Dashboard Terminal Frame -->
  <g transform="translate(705, 105)" filter="url(#cTerminalShadow)">
    <!-- Terminal Outer Frame -->
    <rect width="440" height="425" rx="20" fill="#090e1a" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Window Titlebar -->
    <path d="M 0 20 A 20 20 0 0 1 20 0 L 420 0 A 20 20 0 0 1 440 20 L 440 48 L 0 48 Z" fill="#0f172a"/>
    <line x1="0" y1="48" x2="440" y2="48" stroke="#1e293b" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="24" cy="24" r="5" fill="#ef4444"/>
    <circle cx="42" cy="24" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="24" r="5" fill="#10b981"/>

    <!-- Window Title & Live Status -->
    <text x="220" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="middle">Executive Health Score</text>
    <text x="415" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#10b981" text-anchor="end">● LIVE</text>

    <!-- Terminal Content Area -->
    <!-- Overall Health Box -->
    <g transform="translate(24, 70)">
      <rect width="392" height="84" rx="14" fill="#0f172a" stroke="#10b981" stroke-opacity="0.35" stroke-width="1"/>
      <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#94a3b8" letter-spacing="1">OVERALL SYSTEM HEALTH</text>
      <text x="20" y="68" font-family="'JetBrains Mono', monospace" font-size="36" font-weight="900" fill="#10b981">98<tspan font-size="22" font-weight="700">%</tspan></text>
      
      <!-- HEALTHY Badge -->
      <rect x="282" y="27" width="90" height="30" rx="15" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="327" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#34d399" text-anchor="middle" letter-spacing="0.5">HEALTHY</text>
    </g>

    <!-- 4-Vector Breakdown Grid -->
    <g transform="translate(24, 172)">
      <!-- Item 1: Deployment -->
      <rect width="190" height="66" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Deployment</text>
      <text x="16" y="52" font-family="'JetBrains Mono', monospace" font-size="17" font-weight="800" fill="#10b981">100%</text>

      <!-- Item 2: Reliability -->
      <rect x="202" width="190" height="66" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="218" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Reliability</text>
      <text x="218" y="52" font-family="'JetBrains Mono', monospace" font-size="17" font-weight="800" fill="#10b981">100%</text>

      <!-- Item 3: Infrastructure -->
      <rect y="76" width="190" height="66" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Infrastructure</text>
      <text x="16" y="128" font-family="'JetBrains Mono', monospace" font-size="17" font-weight="800" fill="#f59e0b">90%</text>

      <!-- Item 4: Security -->
      <rect x="202" y="76" width="190" height="66" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="218" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Security</text>
      <text x="218" y="128" font-family="'JetBrains Mono', monospace" font-size="17" font-weight="800" fill="#10b981">100%</text>
    </g>

    <!-- Mini Livewire Pulse Bar -->
    <g transform="translate(24, 334)">
      <rect width="392" height="42" rx="10" fill="#047857" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.35" stroke-width="1"/>
      <circle cx="20" cy="21" r="4.5" fill="#10b981"/>
      <text x="34" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#a7f3d0">All 12 Production Checks Passed · Zero SaaS Overhead</text>
    </g>
  </g>
</svg>